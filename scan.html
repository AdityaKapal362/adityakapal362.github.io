<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resi Barcode Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin: 0 0 20px;
            font-size: 28px;
        }

        .scanner-card {
            background: white;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 75%;
            height: 25%;
            transform: translate(-50%, -50%);
            border: 3px solid #00ff66;
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .status {
            text-align: center;
            margin-top: 12px;
            font-weight: bold;
            min-height: 24px;
        }

        .status.ready {
            color: #16803c;
        }

        .status.error {
            color: #d93025;
        }

        .status.warning {
            color: #d97706;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 13px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #startButton {
            background: #16803c;
            color: white;
        }

        #stopButton {
            background: #d93025;
            color: white;
        }

        #exportButton {
            background: #333;
            color: white;
        }

        #clearButton {
            background: #777;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .last-scan {
            margin-top: 15px;
            padding: 15px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            text-align: center;
        }

        .last-scan-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        #lastBarcode {
            font-size: 20px;
            font-weight: bold;
            word-break: break-all;
        }

        #lastMessage {
            margin-top: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .stat {
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .stat-number {
            font-size: 26px;
            font-weight: bold;
        }

        .stat-label {
            margin-top: 4px;
            color: #666;
            font-size: 13px;
        }

        .history-card {
            margin-top: 20px;
            background: white;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .history-header h2 {
            margin: 0;
            font-size: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #16803c;
        }

        #historyList {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            border-left: 4px solid #16803c;
        }

        .history-number {
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #16803c;
            color: white;
            border-radius: 50%;
            font-size: 13px;
            font-weight: bold;
        }

        .history-content {
            flex: 1;
            min-width: 0;
        }

        .barcode {
            font-weight: bold;
            word-break: break-all;
        }

        .timestamp {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }

        .badge {
            background: #dcfce7;
            color: #166534;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: #777;
        }

        .info {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            h1 {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
            }

            .history-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .history-item {
                align-items: flex-start;
            }

            .badge {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📦 Resi Barcode Scanner</h1>

    <div class="scanner-card">

        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <div class="scanner-frame"></div>
        </div>

        <div id="status" class="status">
            Kamera belum dimulai
        </div>

        <div class="buttons">
            <button id="startButton">
                ▶ Mulai Scan
            </button>

            <button id="stopButton" disabled>
                ⏹ Stop
            </button>
        </div>

        <div class="last-scan">

            <div class="last-scan-title">
                Hasil Scan Terakhir
            </div>

            <div id="lastBarcode">
                -
            </div>

            <div id="lastMessage">
                Belum ada scan
            </div>

        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <div id="totalScan" class="stat-number">
                0
            </div>

            <div class="stat-label">
                Total Resi
            </div>
        </div>

        <div class="stat">
            <div id="uniqueScan" class="stat-number">
                0
            </div>

            <div class="stat-label">
                Resi Unik
            </div>
        </div>

    </div>

    <div class="history-card">

        <div class="history-header">
            <h2>📋 History Scan</h2>
        </div>

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Cari nomor resi..."
            autocomplete="off"
        >

        <div id="historyList">
            <div class="empty">
                Belum ada barcode yang discan.
            </div>
        </div>

        <div class="buttons">

            <button id="exportButton">
                📥 Export CSV
            </button>

            <button id="clearButton">
                🗑 Hapus History
            </button>

        </div>

    </div>

    <div class="info">
        Barcode yang sudah pernah discan tidak akan disimpan lagi.
        <br>
        Data tersimpan otomatis di browser perangkat ini.
    </div>

</div>


<script type="module">

    /*
     * ============================================================
     * ZXING IMPORT
     * ============================================================
     */

    import {
        BrowserMultiFormatReader
    } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";


    /*
     * ============================================================
     * ELEMENT
     * ============================================================
     */

    const video = document.getElementById("video");

    const statusElement =
        document.getElementById("status");

    const lastBarcodeElement =
        document.getElementById("lastBarcode");

    const lastMessageElement =
        document.getElementById("lastMessage");

    const startButton =
        document.getElementById("startButton");

    const stopButton =
        document.getElementById("stopButton");

    const exportButton =
        document.getElementById("exportButton");

    const clearButton =
        document.getElementById("clearButton");

    const searchInput =
        document.getElementById("searchInput");

    const historyList =
        document.getElementById("historyList");

    const totalScanElement =
        document.getElementById("totalScan");

    const uniqueScanElement =
        document.getElementById("uniqueScan");


    /*
     * ============================================================
     * VARIABLES
     * ============================================================
     */

    const STORAGE_KEY = "resiScannerHistory";

    // Jeda agar barcode yang sama tidak terbaca berkali-kali
    // dalam waktu sangat cepat.
    const SCAN_COOLDOWN = 1500;

    let codeReader = null;

    let scanning = false;

    let currentControls = null;

    let history = [];

    let lastDetectedBarcode = "";

    let lastDetectedTime = 0;


    /*
     * ============================================================
     * LOAD HISTORY
     * ============================================================
     *
     * Sekalian membersihkan duplicate dari versi lama aplikasi.
     */

    function loadHistory() {

        try {

            const saved =
                localStorage.getItem(STORAGE_KEY);

            if (!saved) {

                history = [];

                renderHistory();

                updateStatistics();

                return;
            }

            const parsed =
                JSON.parse(saved);

            if (!Array.isArray(parsed)) {

                history = [];

                saveHistory();

                renderHistory();

                updateStatistics();

                return;
            }

            const seen = new Set();

            const cleanedHistory = [];

            for (const item of parsed) {

                let barcode = "";

                let timestamp = null;


                /*
                 * Support format lama:
                 *
                 * {
                 *   barcode: "...",
                 *   timestamp: "..."
                 * }
                 *
                 * maupun:
                 *
                 * "SPXID..."
                 */

                if (typeof item === "string") {

                    barcode = item.trim();

                } else if (
                    item &&
                    typeof item === "object"
                ) {

                    barcode =
                        String(
                            item.barcode || ""
                        ).trim();

                    timestamp =
                        item.timestamp || null;
                }


                if (!barcode) {
                    continue;
                }


                /*
                 * Kalau barcode sudah pernah ditemukan,
                 * jangan masukkan lagi.
                 */

                if (seen.has(barcode)) {
                    continue;
                }

                seen.add(barcode);


                cleanedHistory.push({

                    barcode: barcode,

                    timestamp:
                        timestamp ||
                        new Date().toISOString()

                });

            }

            history = cleanedHistory;

            saveHistory();

            renderHistory();

            updateStatistics();

        } catch (error) {

            console.error(
                "Gagal membaca history:",
                error
            );

            history = [];

            saveHistory();

            renderHistory();

            updateStatistics();
        }
    }


    /*
     * ============================================================
     * SAVE HISTORY
     * ============================================================
     */

    function saveHistory() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(history)
            );

        } catch (error) {

            console.error(
                "Gagal menyimpan history:",
                error
            );
        }
    }


    /*
     * ============================================================
     * UPDATE STATISTICS
     * ============================================================
     */

    function updateStatistics() {

        const total = history.length;

        totalScanElement.textContent =
            total;

        uniqueScanElement.textContent =
            total;
    }


    /*
     * ============================================================
     * FORMAT DATE
     * ============================================================
     */

    function formatDate(timestamp) {

        try {

            const date =
                new Date(timestamp);

            return date.toLocaleString(
                "id-ID",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

        } catch (error) {

            return "-";
        }
    }


    /*
     * ============================================================
     * RENDER HISTORY
     * ============================================================
     */

    function renderHistory() {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        const filtered =
            history.filter(item => {

                return item.barcode
                    .toLowerCase()
                    .includes(keyword);

            });


        historyList.innerHTML = "";


        if (filtered.length === 0) {

            const empty =
                document.createElement("div");

            empty.className = "empty";

            if (history.length === 0) {

                empty.textContent =
                    "Belum ada barcode yang discan.";

            } else {

                empty.textContent =
                    "Barcode tidak ditemukan.";
            }

            historyList.appendChild(empty);

            return;
        }


        filtered.forEach(
            (item, index) => {

                const row =
                    document.createElement("div");

                row.className =
                    "history-item";


                const number =
                    document.createElement("div");

                number.className =
                    "history-number";

                number.textContent =
                    index + 1;


                const content =
                    document.createElement("div");

                content.className =
                    "history-content";


                const barcode =
                    document.createElement("div");

                barcode.className =
                    "barcode";

                barcode.textContent =
                    item.barcode;


                const timestamp =
                    document.createElement("div");

                timestamp.className =
                    "timestamp";

                timestamp.textContent =
                    formatDate(item.timestamp);


                content.appendChild(barcode);

                content.appendChild(timestamp);


                const badge =
                    document.createElement("div");

                badge.className =
                    "badge";

                badge.textContent =
                    "RESI";


                row.appendChild(number);

                row.appendChild(content);

                row.appendChild(badge);


                historyList.appendChild(row);

            }
        );
    }


    /*
     * ============================================================
     * SHOW LAST SCAN
     * ============================================================
     */

    function showLastScanNew(barcode) {

        lastBarcodeElement.textContent =
            barcode;

        lastMessageElement.textContent =
            "🟢 RESI BARU — berhasil disimpan";

        lastMessageElement.style.color =
            "#16803c";
    }


    function showLastScanDuplicate(barcode) {

        lastBarcodeElement.textContent =
            barcode;

        lastMessageElement.textContent =
            "🔴 SUDAH ADA — tidak disimpan";

        lastMessageElement.style.color =
            "#d93025";
    }


    /*
     * ============================================================
     * SOUND
     * ============================================================
     */

    function beep() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                return;
            }

            const audioContext =
                new AudioContext();

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type = "sine";

            oscillator.frequency.value = 900;

            gain.gain.value = 0.15;


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.12
            );

        } catch (error) {

            console.log(
                "Beep tidak tersedia."
            );
        }
    }


    /*
     * ============================================================
     * VIBRATION
     * ============================================================
     */

    function vibrate() {

        try {

            if (
                "vibrate" in navigator
            ) {

                navigator.vibrate(100);
            }

        } catch (error) {

            // Tidak masalah kalau device tidak support.
        }
    }


    /*
     * ============================================================
     * PROCESS BARCODE
     * ============================================================
     */

    function processBarcode(rawBarcode) {

        if (!rawBarcode) {
            return;
        }


        const barcode =
            String(rawBarcode).trim();


        if (!barcode) {
            return;
        }


        /*
         * ========================================================
         * COOLDOWN
         * ========================================================
         *
         * Mencegah kamera membaca barcode yang sama berkali-kali
         * dalam beberapa frame.
         */

        const now =
            Date.now();

        if (
            barcode === lastDetectedBarcode &&
            now - lastDetectedTime <
                SCAN_COOLDOWN
        ) {

            return;
        }

        lastDetectedBarcode =
            barcode;

        lastDetectedTime =
            now;


        /*
         * ========================================================
         * CEK DUPLICATE
         * ========================================================
         *
         * Barcode yang sudah ada di history:
         *
         * - Tidak ditambahkan
         * - Tidak membuat entry baru
         * - Hanya memberi notifikasi
         */

        const alreadyExists =
            history.some(
                item =>
                    item.barcode === barcode
            );


        if (alreadyExists) {

            showLastScanDuplicate(
                barcode
            );

            beep();

            vibrate();

            return;
        }


        /*
         * ========================================================
         * BARCODE BARU
         * ========================================================
         */

        const newItem = {

            barcode: barcode,

            timestamp:
                new Date().toISOString()

        };


        /*
         * unshift = barcode terbaru berada
         * di posisi paling atas.
         */

        history.unshift(
            newItem
        );


        saveHistory();

        renderHistory();

        updateStatistics();

        showLastScanNew(
            barcode
        );

        beep();

        vibrate();

    }


    /*
     * ============================================================
     * START CAMERA
     * ============================================================
     */

    async function startScanner() {

        if (scanning) {
            return;
        }


        /*
         * Browser harus menggunakan HTTPS atau localhost
         * untuk camera access.
         */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            setStatus(
                "Browser tidak mendukung kamera atau halaman belum HTTPS.",
                "error"
            );

            return;
        }


        try {

            setStatus(
                "Meminta izin kamera...",
                "warning"
            );


            /*
             * Minta permission kamera secara eksplisit.
             */

            const stream =
                await navigator.mediaDevices.getUserMedia(
                    {
                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },
                        audio: false
                    }
                );


            /*
             * Pasang stream ke video.
             */

            video.srcObject =
                stream;


            await video.play();


            /*
             * Buat ZXing reader.
             */

            codeReader =
                new BrowserMultiFormatReader();


            scanning = true;


            startButton.disabled =
                true;

            stopButton.disabled =
                false;


            setStatus(
                "🟢 Kamera aktif — arahkan barcode ke kotak.",
                "ready"
            );


            /*
             * Mulai decode secara continuous.
             */

            currentControls =
                await codeReader.decodeFromVideoElement(
                    video,
                    (result, error) => {

                        if (result) {

                            const text =
                                result.getText();

                            processBarcode(
                                text
                            );
                        }


                        /*
                         * Error decode seperti NotFoundException
                         * adalah normal karena kamera terus mencari
                         * barcode.
                         *
                         * Jadi tidak perlu ditampilkan ke user.
                         */

                    }
                );


        } catch (error) {

            console.error(
                "Camera error:",
                error
            );


            scanning = false;

            startButton.disabled =
                false;

            stopButton.disabled =
                true;


            if (
                error.name ===
                "NotAllowedError"
            ) {

                setStatus(
                    "❌ Izin kamera ditolak. Izinkan kamera di browser.",
                    "error"
                );

            } else if (
                error.name ===
                "NotFoundError"
            ) {

                setStatus(
                    "❌ Kamera tidak ditemukan.",
                    "error"
                );

            } else if (
                error.name ===
                "NotReadableError"
            ) {

                setStatus(
                    "❌ Kamera sedang digunakan aplikasi lain.",
                    "error"
                );

            } else {

                setStatus(
                    "❌ Gagal membuka kamera: " +
                    error.message,
                    "error"
                );
            }
        }
    }


    /*
     * ============================================================
     * STOP CAMERA
     * ============================================================
     */

    function stopScanner() {

        scanning = false;


        /*
         * Stop ZXing.
         */

        try {

            if (currentControls) {

                currentControls.stop();

                currentControls =
                    null;
            }

        } catch (error) {

            console.error(
                "Gagal stop ZXing:",
                error
            );
        }


        /*
         * Reset reader.
         */

        try {

            if (codeReader) {

                codeReader.reset();

                codeReader =
                    null;
            }

        } catch (error) {

            console.error(
                "Gagal reset reader:",
                error
            );
        }


        /*
         * Stop semua camera tracks.
         */

        try {

            if (video.srcObject) {

                const tracks =
                    video.srcObject.getTracks();

                tracks.forEach(
                    track => track.stop()
                );

                video.srcObject =
                    null;
            }

        } catch (error) {

            console.error(
                "Gagal stop camera:",
                error
            );
        }


        startButton.disabled =
            false;

        stopButton.disabled =
            true;


        setStatus(
            "Kamera berhenti.",
            ""
        );
    }


    /*
     * ============================================================
     * STATUS
     * ============================================================
     */

    function setStatus(
        message,
        type
    ) {

        statusElement.textContent =
            message;

        statusElement.className =
            "status";


        if (type) {

            statusElement.classList.add(
                type
            );
        }
    }


    /*
     * ============================================================
     * SEARCH
     * ============================================================
     */

    searchInput.addEventListener(
        "input",
        () => {

            renderHistory();

        }
    );


    /*
     * ============================================================
     * EXPORT CSV
     * ============================================================
     */

    function exportCSV() {

        if (history.length === 0) {

            alert(
                "Belum ada data untuk diexport."
            );

            return;
        }


        let csv =
            "No,Barcode,Timestamp\n";


        history.forEach(
            (item, index) => {

                /*
                 * Escape tanda kutip CSV.
                 */

                const barcode =
                    String(item.barcode)
                        .replace(
                            /"/g,
                            '""'
                        );


                csv +=
                    `${index + 1},"${barcode}","${formatDate(item.timestamp)}"\n`;

            }
        );


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement("a");


        link.href =
            url;

        link.download =
            "history-resi-" +
            new Date()
                .toISOString()
                .slice(0, 10) +
            ".csv";


        document.body.appendChild(
            link
        );

        link.click();

        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );
    }


    /*
     * ============================================================
     * CLEAR HISTORY
     * ============================================================
     */

    function clearHistory() {

        if (history.length === 0) {

            alert(
                "History sudah kosong."
            );

            return;
        }


        const confirmed =
            confirm(
                "Yakin ingin menghapus semua history scan?"
            );


        if (!confirmed) {
            return;
        }


        history = [];


        saveHistory();

        renderHistory();

        updateStatistics();


        lastBarcodeElement.textContent =
            "-";

        lastMessageElement.textContent =
            "History telah dihapus";

        lastMessageElement.style.color =
            "#777";
    }


    /*
     * ============================================================
     * BUTTON EVENTS
     * ============================================================
     */

    startButton.addEventListener(
        "click",
        startScanner
    );


    stopButton.addEventListener(
        "click",
        stopScanner
    );


    exportButton.addEventListener(
        "click",
        exportCSV
    );


    clearButton.addEventListener(
        "click",
        clearHistory
    );


    /*
     * ============================================================
     * INITIALIZE
     * ============================================================
     */

    loadHistory();


    /*
     * ============================================================
     * CLEANUP
     * ============================================================
     */

    window.addEventListener(
        "beforeunload",
        () => {

            stopScanner();

        }
    );

</script>

</body>
</html>
