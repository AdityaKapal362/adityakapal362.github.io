<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#111827">

    <title>Resi Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 16px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 13px;
            opacity: 0.7;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 14px;
        }

        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .scanner-frame {
            position: absolute;
            left: 10%;
            top: 25%;
            width: 80%;
            height: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            left: 12%;
            width: 76%;
            height: 2px;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: scanLine 2s linear infinite;
            pointer-events: none;
        }

        @keyframes scanLine {
            0% {
                top: 28%;
            }

            50% {
                top: 72%;
            }

            100% {
                top: 28%;
            }
        }

        .camera-status {
            text-align: center;
            padding: 10px;
            font-size: 13px;
        }

        .online {
            color: #16a34a;
            font-weight: bold;
        }

        .offline {
            color: #dc2626;
            font-weight: bold;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .camera-buttons {
            display: flex;
            gap: 8px;
        }

        .camera-buttons button {
            flex: 1;
        }

        .btn-start {
            background: #16a34a;
            color: white;
        }

        .btn-stop {
            background: #dc2626;
            color: white;
        }

        .btn-export {
            background: #2563eb;
            color: white;
        }

        .btn-clear {
            background: #e5e7eb;
            color: #111827;
        }

        .last-scan {
            margin-top: 14px;
            padding: 16px;
            background: white;
            border-radius: 12px;
            border-left: 5px solid #16a34a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .last-scan.double {
            border-left-color: #dc2626;
        }

        .last-title {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .last-value {
            font-size: 17px;
            font-weight: bold;
            word-break: break-all;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 14px;
        }

        .stat {
            background: white;
            border-radius: 12px;
            padding: 14px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 22px;
            font-weight: bold;
        }

        .stat-label {
            margin-top: 4px;
            font-size: 10px;
            color: #6b7280;
        }

        .history-box {
            margin-top: 14px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .history-header {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        .history-header h2 {
            margin: 0 0 10px;
            font-size: 17px;
        }

        #search {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        #search:focus {
            border-color: #2563eb;
        }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid #f1f1f1;
        }

        .status {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
            border-radius: 50%;
        }

        .status-new {
            background: #16a34a;
        }

        .status-double {
            background: #dc2626;
        }

        .history-content {
            flex: 1;
            min-width: 0;
        }

        .history-barcode {
            font-size: 14px;
            font-weight: bold;
            word-break: break-all;
        }

        .history-time {
            margin-top: 3px;
            font-size: 11px;
            color: #9ca3af;
        }

        .history-badge {
            flex-shrink: 0;
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }

        .badge-new {
            background: #dcfce7;
            color: #166534;
        }

        .badge-double {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            padding: 30px 15px;
            text-align: center;
            color: #9ca3af;
        }

        .bottom-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        @media (max-width: 400px) {
            .stat-number {
                font-size: 18px;
            }

            .stat-label {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📦 Resi Scanner</h1>
    <p>Continuous Barcode Scanner</p>
</header>

<div class="container">

    <div class="scanner-container">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <div class="scanner-frame"></div>
        <div class="scan-line"></div>

    </div>

    <div class="camera-status">
        Status:
        <span id="cameraStatus" class="offline">
            Kamera belum aktif
        </span>
    </div>

    <div class="camera-buttons">

        <button
            id="startButton"
            class="btn-start">
            📷 Mulai Scan
        </button>

        <button
            id="stopButton"
            class="btn-stop"
            disabled>
            ⏹ Stop
        </button>

    </div>

    <div id="lastScanBox" class="last-scan">

        <div class="last-title">
            HASIL SCAN TERAKHIR
        </div>

        <div id="lastScan" class="last-value">
            Belum ada scan
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <div id="totalScan" class="stat-number">0</div>
            <div class="stat-label">TOTAL SCAN</div>
        </div>

        <div class="stat">
            <div id="uniqueScan" class="stat-number">0</div>
            <div class="stat-label">RESI UNIK</div>
        </div>

        <div class="stat">
            <div id="duplicateScan" class="stat-number">0</div>
            <div class="stat-label">DOUBLE</div>
        </div>

    </div>

    <div class="history-box">

        <div class="history-header">

            <h2>📋 History Scan</h2>

            <input
                type="text"
                id="search"
                placeholder="🔍 Cari nomor resi...">

        </div>

        <div id="historyList" class="history-list">
            <div class="empty">
                Belum ada barcode yang discan.
            </div>
        </div>

    </div>

    <div class="bottom-buttons">

        <button
            id="exportButton"
            class="btn-export">
            📥 Export CSV
        </button>

        <button
            id="clearButton"
            class="btn-clear">
            🗑️ Hapus History
        </button>

    </div>

</div>


<!--
    ZXING ES MODULE

    Tidak menggunakan:
    ZXing
    ZXingBrowser

    Jadi tidak akan ada error:
    "ZXingBrowser is not defined"
-->

<script type="module">

import {
    BrowserMultiFormatReader
} from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";


/* =========================================
   CONFIG
========================================= */

const SCAN_COOLDOWN = 1500;


/* =========================================
   VARIABLES
========================================= */

let codeReader = null;
let scanning = false;
let currentControls = null;

let history = [];

let lastDetectedCode = "";
let lastDetectedTime = 0;


/* =========================================
   DOM
========================================= */

const video =
    document.getElementById("video");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const cameraStatus =
    document.getElementById("cameraStatus");

const lastScan =
    document.getElementById("lastScan");

const lastScanBox =
    document.getElementById("lastScanBox");

const totalScan =
    document.getElementById("totalScan");

const uniqueScan =
    document.getElementById("uniqueScan");

const duplicateScan =
    document.getElementById("duplicateScan");

const historyList =
    document.getElementById("historyList");

const search =
    document.getElementById("search");

const exportButton =
    document.getElementById("exportButton");

const clearButton =
    document.getElementById("clearButton");


/* =========================================
   LOAD HISTORY
========================================= */

function loadHistory() {

    try {

        const saved =
            localStorage.getItem(
                "resiScannerHistory"
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {
                history = parsed;
            }

        }

    } catch (error) {

        console.error(
            "Gagal load history:",
            error
        );

        history = [];

    }

    renderHistory();
    updateStatistics();

}


/* =========================================
   SAVE HISTORY
========================================= */

function saveHistory() {

    try {

        localStorage.setItem(
            "resiScannerHistory",
            JSON.stringify(history)
        );

    } catch (error) {

        console.error(
            "Gagal menyimpan history:",
            error
        );

    }

}


/* =========================================
   START SCANNER
========================================= */

async function startScanner() {

    if (scanning) {
        return;
    }


    /*
     * Kamera membutuhkan HTTPS
     */

    if (
        !window.isSecureContext &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
    ) {

        alert(
            "Akses kamera membutuhkan HTTPS.\n\n" +
            "Buka website menggunakan https://"
        );

        return;

    }


    /*
     * Cek API kamera
     */

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Browser ini tidak mendukung akses kamera."
        );

        return;

    }


    try {

        setCameraStatus(
            "Meminta izin kamera...",
            false
        );


        /*
         * LANGSUNG MINTA KAMERA
         *
         * Ini akan memunculkan popup permission
         * jika user belum pernah memilih Allow/Block.
         */

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });


        /*
         * Gunakan kamera yang SUDAH dibuka.
         *
         * Ini menghindari masalah:
         * - device belum terbaca
         * - label kamera kosong sebelum permission
         * - permission diminta dua kali
         */

        video.srcObject = stream;

        await video.play();


        /*
         * Buat scanner
         */

        codeReader =
            new BrowserMultiFormatReader();


        scanning = true;

        startButton.disabled = true;
        stopButton.disabled = false;


        setCameraStatus(
            "Kamera aktif - siap scan",
            true
        );


        /*
         * CONTINUOUS SCANNING
         *
         * decodeFromVideoElement akan terus
         * membaca video selama scanner aktif.
         */

        currentControls =
            await codeReader.decodeFromVideoElement(
                video,
                (result, error) => {

                    if (!scanning) {
                        return;
                    }


                    if (result) {

                        const barcode =
                            result.getText();

                        processBarcode(
                            barcode
                        );

                    }


                    /*
                     * Error "NotFoundException"
                     * normal terjadi ketika belum ada
                     * barcode di kamera.
                     *
                     * Karena itu tidak perlu alert.
                     */

                }
            );


    } catch (error) {

        console.error(
            "Scanner error:",
            error
        );


        scanning = false;

        startButton.disabled = false;
        stopButton.disabled = true;


        stopVideoStream();


        if (
            error.name === "NotAllowedError" ||
            error.name === "SecurityError"
        ) {

            setCameraStatus(
                "Izin kamera ditolak",
                false
            );

            alert(
                "Izin kamera ditolak.\n\n" +
                "Silakan izinkan akses kamera " +
                "di pengaturan browser."
            );

        }

        else if (
            error.name === "NotFoundError"
        ) {

            setCameraStatus(
                "Kamera tidak ditemukan",
                false
            );

            alert(
                "Tidak ada kamera yang ditemukan."
            );

        }

        else if (
            error.name === "NotReadableError"
        ) {

            setCameraStatus(
                "Kamera sedang digunakan",
                false
            );

            alert(
                "Kamera sedang digunakan " +
                "oleh aplikasi atau browser lain."
            );

        }

        else {

            setCameraStatus(
                "Gagal membuka scanner",
                false
            );

            alert(
                "Gagal membuka scanner.\n\n" +
                error.message
            );

        }

    }

}


/* =========================================
   STOP SCANNER
========================================= */

function stopScanner() {

    scanning = false;


    /*
     * Stop ZXing
     */

    if (currentControls) {

        try {

            currentControls.stop();

        } catch (error) {

            console.error(
                "Gagal stop scanner:",
                error
            );

        }

        currentControls = null;

    }


    /*
     * Reset reader
     */

    if (codeReader) {

        try {

            codeReader.reset();

        } catch (error) {

            console.error(error);

        }

        codeReader = null;

    }


    /*
     * Stop kamera
     */

    stopVideoStream();


    startButton.disabled = false;
    stopButton.disabled = true;


    setCameraStatus(
        "Kamera berhenti",
        false
    );

}


/* =========================================
   STOP VIDEO STREAM
========================================= */

function stopVideoStream() {

    if (video.srcObject) {

        const stream =
            video.srcObject;

        if (
            stream &&
            typeof stream.getTracks === "function"
        ) {

            stream
                .getTracks()
                .forEach(track => {
                    track.stop();
                });

        }

        video.srcObject = null;

    }

}


/* =========================================
   PROCESS BARCODE
========================================= */

function processBarcode(barcode) {

    barcode =
        String(barcode || "").trim();


    if (!barcode) {
        return;
    }


    const now =
        Date.now();


    /*
     * Anti spam:
     *
     * Barcode yang sama tidak akan masuk lagi
     * selama 1.5 detik.
     */

    if (
        barcode === lastDetectedCode &&
        now - lastDetectedTime < SCAN_COOLDOWN
    ) {

        return;

    }


    lastDetectedCode = barcode;
    lastDetectedTime = now;


    /*
     * Cek apakah barcode sudah pernah ada
     */

    const isDuplicate =
        history.some(
            item => item.barcode === barcode
        );


    /*
     * Masukkan ke Array
     */

    history.unshift({

        barcode: barcode,

        duplicate: isDuplicate,

        timestamp:
            new Date().toISOString()

    });


    saveHistory();


    showLastScan(
        barcode,
        isDuplicate
    );


    renderHistory();


    updateStatistics();


    playBeep(
        isDuplicate
    );


    if (navigator.vibrate) {

        navigator.vibrate(
            isDuplicate
                ? [100, 70, 100]
                : 80
        );

    }

}


/* =========================================
   LAST SCAN
========================================= */

function showLastScan(
    barcode,
    isDuplicate
) {

    lastScanBox.classList.toggle(
        "double",
        isDuplicate
    );


    lastScan.textContent =
        isDuplicate
            ? "🔴 DOUBLE: " + barcode
            : "🟢 BARU: " + barcode;

}


/* =========================================
   RENDER HISTORY
========================================= */

function renderHistory() {

    const keyword =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        history.filter(item =>
            item.barcode
                .toLowerCase()
                .includes(keyword)
        );


    if (filtered.length === 0) {

        historyList.innerHTML =

            '<div class="empty">' +

            (
                history.length === 0
                    ? "Belum ada barcode yang discan."
                    : "Nomor resi tidak ditemukan."
            ) +

            '</div>';

        return;

    }


    historyList.innerHTML =
        filtered.map(item => {

            const date =
                new Date(item.timestamp);


            const time =
                date.toLocaleString(
                    "id-ID",
                    {
                        dateStyle: "short",
                        timeStyle: "medium"
                    }
                );


            const safeBarcode =
                escapeHTML(item.barcode);


            return

                '<div class="history-item">' +

                    '<div class="status ' +

                        (
                            item.duplicate
                                ? "status-double"
                                : "status-new"
                        ) +

                    '"></div>' +

                    '<div class="history-content">' +

                        '<div class="history-barcode">' +

                            safeBarcode +

                        '</div>' +

                        '<div class="history-time">' +

                            time +

                        '</div>' +

                    '</div>' +

                    '<div class="history-badge ' +

                        (
                            item.duplicate
                                ? "badge-double"
                                : "badge-new"
                        ) +

                    '">' +

                        (
                            item.duplicate
                                ? "DOUBLE"
                                : "BARU"
                        ) +

                    '</div>' +

                '</div>';

        }).join("");

}


/* =========================================
   STATISTICS
========================================= */

function updateStatistics() {

    const uniqueCount =
        new Set(
            history.map(
                item => item.barcode
            )
        ).size;


    const duplicateCount =
        history.filter(
            item => item.duplicate
        ).length;


    totalScan.textContent =
        history.length;

    uniqueScan.textContent =
        uniqueCount;

    duplicateScan.textContent =
        duplicateCount;

}


/* =========================================
   EXPORT CSV
========================================= */

function exportCSV() {

    if (history.length === 0) {

        alert(
            "Belum ada data untuk diexport."
        );

        return;

    }


    let csv =
        "No,Nomor Resi,Status,Waktu\n";


    history
        .slice()
        .reverse()
        .forEach((item, index) => {

            const date =
                new Date(item.timestamp);


            const time =
                date.toLocaleString("id-ID");


            const barcode =
                item.barcode.replace(
                    /"/g,
                    '""'
                );


            csv +=

                (index + 1) + "," +

                '"' + barcode + '",' +

                (
                    item.duplicate
                        ? "DOUBLE"
                        : "BARU"
                ) + "," +

                '"' + time + '"\n';

        });


    /*
     * BOM (\uFEFF)
     * agar Excel membaca UTF-8 dengan benar.
     */

    const blob =
        new Blob(
            ["\uFEFF" + csv],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        "history-resi-" +

        new Date()
            .toISOString()
            .slice(0, 10) +

        ".csv";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    URL.revokeObjectURL(url);

}


/* =========================================
   CLEAR HISTORY
========================================= */

function clearHistory() {

    if (history.length === 0) {

        return;

    }


    if (
        !confirm(
            "Yakin ingin menghapus seluruh history scan?"
        )
    ) {

        return;

    }


    history = [];


    lastDetectedCode = "";
    lastDetectedTime = 0;


    localStorage.removeItem(
        "resiScannerHistory"
    );


    lastScan.textContent =
        "Belum ada scan";


    lastScanBox.classList.remove(
        "double"
    );


    renderHistory();


    updateStatistics();

}


/* =========================================
   BEEP
========================================= */

function playBeep(isDuplicate) {

    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContextClass) {
            return;
        }


        const audioContext =
            new AudioContextClass();


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.connect(gain);


        gain.connect(
            audioContext.destination
        );


        oscillator.frequency.value =
            isDuplicate
                ? 250
                : 850;


        gain.gain.setValueAtTime(
            0.15,
            audioContext.currentTime
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.12
        );


        oscillator.addEventListener(
            "ended",
            () => {

                audioContext.close();

            }
        );


    } catch (error) {

        console.error(
            "Beep error:",
            error
        );

    }

}


/* =========================================
   STATUS CAMERA
========================================= */

function setCameraStatus(
    text,
    online
) {

    cameraStatus.textContent =
        text;


    cameraStatus.className =
        online
            ? "online"
            : "offline";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================
   EVENT LISTENERS
========================================= */

startButton.addEventListener(
    "click",
    startScanner
);


stopButton.addEventListener(
    "click",
    stopScanner
);


search.addEventListener(
    "input",
    renderHistory
);


exportButton.addEventListener(
    "click",
    exportCSV
);


clearButton.addEventListener(
    "click",
    clearHistory
);


/*
 * Stop kamera ketika halaman ditutup.
 */

window.addEventListener(
    "beforeunload",
    stopScanner
);


/* =========================================
   INITIALIZE
========================================= */

loadHistory();

</script>

</body>
</html>
